; claude-lanes prose lint, the markup-aware half of the anti-slop floor, carried from
; CANONclaude 1.36.0 at the cut on 2026-10-15. The regex hook (.claude/hooks/anti-slop.sh) runs at
; edit time and is advisory. This runs over whole files, understands markdown, and is a gate that
; can fail; it runs only where tools/get-vale.sh has fetched the binary.
;
; Vendored ruleset: tools/vale-styles/signs-of-ai-writing/, pinned at
; github.com/ammil-industries/vale-signs-of-ai-writing @ 305467b (2025-11-22), CC BY-SA 4.0.
; LICENSE and PIN.txt sit beside the vendored files. Never edit them: narrow an over-firing rule
; with a switch below and re-add the narrowed variant under tools/vale-styles/CANON/.
;
; CANON/ holds the eleven hand rules the parent harness calibrated against anti-slop.sh's regexes,
; kept under their own name so the two never disagree about a phrase. CANON.EmDash flags the first
; em-dash, since house style bans the character outright.
;
; The calibration invariant: every enabled rule runs zero-hit over the repo's public prose, and the
; planted fixture (.claude/hooks/anti-slop-fixture.md) must trip. Re-run after any change:
; .claude/hooks/anti-slop-calibrate.sh

StylesPath = tools/vale-styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = signs-of-ai-writing, CANON

; disabled by the parent's re-verification against live prose on 2026-08-07, carried whole:
; bare "showcase", "particularly", the passive, "serves as", and a hedge of a checkable fact are
; ordinary English, and Transitions is structurally dead, every token ending in a comma that
; \b never matches before a space
signs-of-ai-writing.Vocabulary = NO
signs-of-ai-writing.Intensifiers = NO
signs-of-ai-writing.Passive = NO
signs-of-ai-writing.Symbolism = NO
signs-of-ai-writing.Enumeration = NO
signs-of-ai-writing.Transitions = NO

; files whose subject matter IS the ban list
[.claude/rules/writing-style.md]
BasedOnStyles =

[.claude/hooks/anti-slop-fixture.md]
BasedOnStyles =

; frozen records, never edited again
[.claude/docs/backlog/done/**]
BasedOnStyles =

[.claude/docs/backlog-history.md]
BasedOnStyles =

[.claude/docs/board-history.md]
BasedOnStyles =

[.claude/features/**]
BasedOnStyles =

[.claude/inbox/**]
BasedOnStyles =

[node_modules/**]
BasedOnStyles =
